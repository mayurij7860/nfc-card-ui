<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: #020617;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);

    }

    img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 2px solid #38bdf8;
    }

    h1 {
      font-size: 22px;
      margin: 6px 0;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    a {
      display: block;
      text-decoration: none;
      background: #38bdf8;
      color: #020617;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-weight: 600;
      transition: transform 0.15s ease;
    }

    a:hover {
      transform: scale(1.02);
    }

    footer {
      font-size: 11px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
